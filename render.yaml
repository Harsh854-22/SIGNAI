services:
  - type: web
    name: signai-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
