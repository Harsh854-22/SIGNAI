<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You - SignAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4361ee;
      --primary-light: #4895ef;
      --primary-dark: #3f37c9;
      --secondary-color: #4cc9f0;
      --accent-color: #560bad;
      --text-color: #333;
      --text-light: #6c757d;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #dee2e6;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      background: linear-gradient(-45deg, rgba(67, 97, 238, 0.05), rgba(76, 201, 240, 0.05));
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .thank-you-card {
      max-width: 500px;
      width: 100%;
      text-align: center;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 2.5rem;
      background-color: var(--card-bg);
      border: none;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: var(--transition);
    }

    .thank-you-card:hover {
      transform: translateY(-5px) rotateX(1deg) rotateY(1deg);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .thank-you-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(67, 97, 238, 0.1) 0%, transparent 70%);
      transform: rotate(30deg);
      z-index: -1;
      animation: shine 8s infinite;
    }

    @keyframes shine {
      0% { transform: rotate(30deg) translate(-10%, -10%); }
      50% { transform: rotate(30deg) translate(10%, 10%); }
      100% { transform: rotate(30deg) translate(-10%, -10%); }
    }

    .thank-you-icon {
      font-size: 5rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    h2 {
      color: var(--primary-color);
      font-weight: 600;
      margin-bottom: 1rem;
      position: relative;
      display: inline-block;
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      border-radius: 3px;
    }

    p {
      color: var(--text-light);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      padding: 0.6rem 1.5rem;
      font-weight: 500;
      border-radius: 8px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .btn-primary:hover::after {
      transform: scaleX(1);
    }

    /* Responsive adjustments */
    @media (max-width: 576px) {
      .thank-you-card {
        padding: 1.5rem;
      }
      
      .thank-you-icon {
        font-size: 4rem;
      }
      
      h2 {
        font-size: 1.5rem;
      }
      
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="thank-you-card">
    <div class="thank-you-icon">
      <i class="fas fa-hands-helping"></i>
    </div>
    <h2 class="mt-3">Thank You!</h2>
    <p>Your feedback has been received. We appreciate you helping us improve <strong>SignAI</strong> for the deaf community.</p>
    <a href="http://localhost:5000/#" class="btn btn-primary mt-3">
      <i class="fas fa-arrow-left me-2"></i> Back to Home
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Add a subtle animation when the page loads
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.querySelector('.thank-you-card');
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      
      setTimeout(() => {
        card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, 100);
    });
  </script>
</body>
</html>
